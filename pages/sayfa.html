<script>
(async function () {
  const params = new URLSearchParams(window.location.search);
  const slug = params.get("slug");
  const title = document.getElementById("cms-dynamic-title");
  const body = document.getElementById("cms-dynamic-body");
  const error = document.getElementById("cms-dynamic-error");

  if (!slug) {
    title.textContent = "Sayfa bulunamadı";
    error.hidden = false;
    return;
  }

  try {
    const response = await fetch("/api/public-pages?slug=" + encodeURIComponent(slug), {
      headers: { "Accept": "application/json" },
      cache: "no-store"
    });
    const data = await response.json();

    if (!response.ok || !data.success || !data.page) throw new Error("Page not found");

    title.textContent = data.page.title || "EDWISE";
    if (window.EDWISEContent) window.EDWISEContent.render(body, data.page.content || "");
    else body.textContent = data.page.content || "";
    document.title = data.page.meta_title || (data.page.title + " | EDWISE");
    if (data.page.meta_description) {
      const description = document.querySelector('meta[name="description"]');
      if (description) description.content = data.page.meta_description;
    }
  } catch (err) {
    title.textContent = "Sayfa bulunamadı";
    error.hidden = false;
  }
})();
</script>
