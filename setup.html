
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EDWISE Yönetici Kurulumu</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #10101b;
      color: #fff;
      font-family: Arial, sans-serif;
    }
    .panel {
      width: 100%;
      max-width: 430px;
      padding: 32px;
      border: 1px solid #35334c;
      border-radius: 16px;
      background: #1b1a2a;
    }
    h1 { margin-top: 0; font-size: 25px; }
    p { color: #b9b7c9; line-height: 1.5; }
    label { display: block; margin: 18px 0 7px; }
    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #49465f;
      border-radius: 8px;
      background: #11101c;
      color: white;
      font-size: 15px;
    }
    button {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #5b3bd1;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    #result { margin-top: 18px; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main class="panel">
    <h1>EDWISE Yönetici Kurulumu</h1>
    <p>İlk süper yönetici hesabını oluştur.</p>

    <form id="setupForm">
      <label for="username">Kullanıcı adı</label>
      <input id="username" value="basarckmclgl" readonly>

      <label for="email">E-posta</label>
      <input id="email" type="email"
        value="projegelisimi.com@outlook.com" readonly>

      <label for="password">Yönetici parolası</label>
      <input id="password" type="password"
        minlength="12" maxlength="128" required
        autocomplete="new-password"
        placeholder="En az 12 karakter">

      <label for="secret">Kurulum gizli anahtarı</label>
      <input id="secret" type="password" required
        autocomplete="off" placeholder="Cloudflare'daki gizli anahtar">

      <button id="submitButton" type="submit">Yönetici Hesabını Oluştur</button>
    </form>

    <p id="result" role="status"></p>
  </main>

  <script>
    const form = document.getElementById("setupForm");
    const button = document.getElementById("submitButton");
    const result = document.getElementById("result");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      button.disabled = true;
      result.textContent = "Kurulum yapılıyor...";

      try {
        const response = await fetch("/api/setup", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-CMS-Setup-Secret": document.getElementById("secret").value
          },
          body: JSON.stringify({
            username: document.getElementById("username").value,
            email: document.getElementById("email").value,
            password: document.getElementById("password").value
          })
        });

        const data = await response.json();

        result.textContent = data.message ||
          (data.success ? "Kurulum başarılı." : "Kurulum başarısız.");

        if (data.success) {
          form.reset();
          document.getElementById("username").value = "basarckmclgl";
          document.getElementById("email").value =
            "projegelisimi.com@outlook.com";
        }
      } catch (error) {
        result.textContent =
          "Sunucuya ulaşılamadı. Lütfen tekrar dene.";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
