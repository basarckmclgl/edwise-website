
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EDWISE | Yönetici Girişi</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #11101d;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .login {
      width: 100%;
      max-width: 410px;
      padding: 36px;
      background: #1c1a2c;
      border: 1px solid #37334e;
      border-radius: 16px;
      box-shadow: 0 20px 60px #0005;
    }

    .logo {
      color: #a18aff;
      font-size: 27px;
      font-weight: bold;
      letter-spacing: 3px;
    }

    h1 { font-size: 23px; margin: 25px 0 8px; }

    p { color: #aaa7bd; line-height: 1.5; }

    label {
      display: block;
      margin: 20px 0 8px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      color: white;
      background: #11101d;
      border: 1px solid #49445f;
      border-radius: 8px;
      font-size: 15px;
    }

    input:focus {
      outline: 2px solid #8064e8;
      border-color: transparent;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #6848d8;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled { opacity: .6; cursor: wait; }

    #message {
      margin-top: 18px;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .back {
      display: block;
      margin-top: 24px;
      color: #aaa7bd;
      text-align: center;
      text-decoration: none;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main class="login">
    <div class="logo">EDWISE</div>
    <h1>Yönetici Paneli</h1>
    <p>Devam etmek için yönetici hesabınızla giriş yapın.</p>

    <form id="loginForm">
      <label for="username">Kullanıcı adı</label>
      <input id="username" name="username"
        type="text" autocomplete="username" required>

      <label for="password">Parola</label>
      <input id="password" name="password"
        type="password" autocomplete="current-password" required>

      <button id="loginButton" type="submit">Giriş Yap</button>
    </form>

    <a href="#" id="forgotPasswordLink" style="display:block;margin-top:16px;color:#b9a7ff;text-align:center;font-size:14px">Şifremi Unuttum</a>
    <form id="resetRequestForm" hidden><label for="resetEmail">Yönetici e-posta adresi</label><input id="resetEmail" type="email" autocomplete="email" required><button type="submit">Yenileme Bağlantısı Gönder</button></form>
    <form id="resetPasswordForm" hidden><label for="resetNewPassword">Yeni şifre</label><input id="resetNewPassword" type="password" minlength="8" maxlength="128" required autocomplete="new-password"><button type="submit">Şifremi Yenile</button></form>
    <div id="message" role="status"></div>
    <a class="back" href="/">← Ana sayfaya dön</a>
  </main>

  <script>
    const form = document.getElementById("loginForm");
    const button = document.getElementById("loginButton");
    const message = document.getElementById("message");

    const forgot=document.getElementById("forgotPasswordLink");
    const requestForm=document.getElementById("resetRequestForm");
    const resetForm=document.getElementById("resetPasswordForm");
    const resetToken=new URLSearchParams(location.search).get("reset");
    if(resetToken){form.hidden=true;forgot.hidden=true;resetForm.hidden=false;}
    forgot.addEventListener("click",e=>{e.preventDefault();form.hidden=true;forgot.hidden=true;requestForm.hidden=false;});
    requestForm.addEventListener("submit",async e=>{e.preventDefault();message.textContent="İstek gönderiliyor...";try{const r=await fetch("/api/password-reset-request",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify({email:document.getElementById("resetEmail").value.trim()})});const d=await r.json();message.textContent=d.message||"İstek tamamlandı.";}catch{message.textContent="Sunucuya ulaşılamadı.";}});
    resetForm.addEventListener("submit",async e=>{e.preventDefault();const password=document.getElementById("resetNewPassword").value;message.textContent="Şifre güncelleniyor...";try{const r=await fetch("/api/password-reset",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify({token:resetToken,password})});const d=await r.json();message.textContent=d.message||"İşlem tamamlandı.";if(r.ok&&d.success){resetForm.hidden=true;history.replaceState({},"","/admin/");form.hidden=false;}}catch{message.textContent="Sunucuya ulaşılamadı.";}});

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      button.disabled = true;
      message.textContent = "Giriş kontrol ediliyor...";

      try {
        const response = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({
            username: document.getElementById("username").value.trim(),
            password: document.getElementById("password").value
          })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          message.textContent = "Giriş başarılı. Yönlendiriliyorsunuz...";
          window.location.href = "/admin/dashboard.html";
          return;
        }

        message.textContent = data.message || "Giriş başarısız.";
      } catch {
        message.textContent = "Sunucuya ulaşılamadı. Tekrar deneyin.";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
