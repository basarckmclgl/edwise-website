
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EDWISE | Yönetici Girişi</title>
  <style>
    *{box-sizing:border-box}
    :root{font-family:Arial,sans-serif;color-scheme:light}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#f8f7fb 0%,#f1eff7 100%);color:#292638;font-family:Arial,sans-serif}
    .login{width:100%;max-width:430px;padding:42px;background:#fff;border:1px solid #e8e4f0;border-radius:20px;box-shadow:0 18px 55px rgba(39,29,66,.09)}
    .logo{color:#7650d8;font-size:29px;font-weight:800;letter-spacing:3px}
    h1{font-size:25px;line-height:1.25;margin:28px 0 9px;color:#282538}
    p{color:#777487;line-height:1.6;margin:0 0 26px}
    label{display:block;margin:19px 0 8px;font-size:13px;font-weight:700;color:#464256}
    input{width:100%;padding:14px 15px;color:#292638;background:#fff;border:1px solid #dedbe7;border-radius:10px;font-size:15px;transition:border-color .15s,box-shadow .15s}
    input:focus{outline:none;border-color:#9476df;box-shadow:0 0 0 3px rgba(118,80,216,.12)}
    button{width:100%;margin-top:25px;padding:14px;border:0;border-radius:10px;background:#7650d8;color:#fff;font-size:15px;font-weight:700;cursor:pointer;transition:background .15s,transform .15s}
    button:hover{background:#6540c3}button:active{transform:translateY(1px)}button:disabled{opacity:.6;cursor:wait}
    #message{margin-top:18px;font-size:13px;color:#5d5870;overflow-wrap:anywhere}
    .back{display:block;margin-top:25px;color:#777487;text-align:center;text-decoration:none;font-size:13px}
    .back:hover{color:#7650d8}
    #forgotPasswordLink{display:block;margin-top:17px;color:#7650d8!important;text-align:center;font-size:13px;text-decoration:none}
    #forgotPasswordLink:hover{text-decoration:underline}
    [hidden]{display:none!important}
    @media(max-width:480px){body{padding:16px}.login{padding:30px 24px;border-radius:16px}}
  </style>
</head>
<body>
  <main class="login">
    <div class="logo">EDWISE</div>
    <h1>Yönetici Paneli</h1>
    <p>Devam etmek için yönetici hesabınızla giriş yapın.</p>

    <form id="loginForm">
      <label for="username">Kullanıcı adı</label>
      <input id="username" name="username"
        type="text" autocomplete="username" required>

      <label for="password">Parola</label>
      <input id="password" name="password"
        type="password" autocomplete="current-password" required>

      <button id="loginButton" type="submit">Giriş Yap</button>
    </form>

    <a href="#" id="forgotPasswordLink" style="display:block;margin-top:16px;color:#b9a7ff;text-align:center;font-size:14px">Şifremi Unuttum</a>
    <form id="resetRequestForm" hidden><label for="resetEmail">Yönetici e-posta adresi</label><input id="resetEmail" type="email" autocomplete="email" required><button type="submit">Yenileme Bağlantısı Gönder</button></form>
    <form id="resetPasswordForm" hidden><label for="resetNewPassword">Yeni şifre</label><input id="resetNewPassword" type="password" minlength="8" maxlength="128" required autocomplete="new-password"><button type="submit">Şifremi Yenile</button></form>
    <div id="message" role="status"></div>
    <a class="back" href="/">← Ana sayfaya dön</a>
  </main>

  <script>
    // Existing authenticated administrators go straight to the new panel preview.
    fetch("/api/me", {credentials:"same-origin", cache:"no-store"}).then(r=>{if(r.ok) location.replace("/admin/dashboard.html");}).catch(()=>{});
    const form = document.getElementById("loginForm");
    const button = document.getElementById("loginButton");
    const message = document.getElementById("message");

    const forgot=document.getElementById("forgotPasswordLink");
    const requestForm=document.getElementById("resetRequestForm");
    const resetForm=document.getElementById("resetPasswordForm");
    const resetToken=new URLSearchParams(location.search).get("reset");
    const openForgot=new URLSearchParams(location.search).get("forgot")==="1";
    if(resetToken){form.hidden=true;forgot.hidden=true;resetForm.hidden=false;}
    else if(openForgot){form.hidden=true;forgot.hidden=true;requestForm.hidden=false;}
    forgot.addEventListener("click",e=>{e.preventDefault();form.hidden=true;forgot.hidden=true;requestForm.hidden=false;});
    requestForm.addEventListener("submit",async e=>{e.preventDefault();message.textContent="İstek gönderiliyor...";try{const r=await fetch("/api/password-reset-request",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify({email:document.getElementById("resetEmail").value.trim()})});const d=await r.json();message.textContent=d.message||"İstek tamamlandı.";}catch{message.textContent="Sunucuya ulaşılamadı.";}});
    resetForm.addEventListener("submit",async e=>{e.preventDefault();const password=document.getElementById("resetNewPassword").value;message.textContent="Şifre güncelleniyor...";try{const r=await fetch("/api/password-reset",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify({token:resetToken,password})});const d=await r.json();message.textContent=d.message||"İşlem tamamlandı.";if(r.ok&&d.success){resetForm.hidden=true;history.replaceState({},"","/admin/");form.hidden=false;}}catch{message.textContent="Sunucuya ulaşılamadı.";}});

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      button.disabled = true;
      message.textContent = "Giriş kontrol ediliyor...";

      try {
        const response = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({
            username: document.getElementById("username").value.trim(),
            password: document.getElementById("password").value
          })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          message.textContent = "Giriş başarılı. Yönlendiriliyorsunuz...";
          window.location.href = "/admin/dashboard.html";
          return;
        }

        message.textContent = data.message || "Giriş başarısız.";
      } catch {
        message.textContent = "Sunucuya ulaşılamadı. Tekrar deneyin.";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
