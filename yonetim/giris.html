<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>EDWISE | Yönetici Girişi</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#f7f1ff,#fff 65%);font:15px Inter,system-ui,Arial;color:#54218f}.card{width:min(100%,420px);padding:34px;background:#fff;border:1px solid #eee5f7;border-radius:20px;box-shadow:0 18px 55px #54218f12}.brand{text-align:center;font-size:12px;letter-spacing:2px;color:#8b55c5;font-weight:800}.brand strong{display:block;font-size:23px;letter-spacing:.5px;color:#54218f;margin:7px 0 4px}.sub{text-align:center;color:#827292;font-size:13px;margin:0 0 28px}label{display:block;font-size:12px;font-weight:700;margin:16px 0 7px}input{width:100%;padding:13px;border:1px solid #e5d9f0;border-radius:10px;font:inherit;color:#342344;outline:none}input:focus{border-color:#8b55c5;box-shadow:0 0 0 3px #8b55c51a}.password-wrap{position:relative}.password-wrap input{padding-right:48px}.password-toggle{position:absolute;right:7px;top:50%;transform:translateY(-50%);width:36px;height:36px;margin:0;padding:7px;border:0;border-radius:8px;background:transparent;color:#76558f;display:grid;place-items:center;cursor:pointer}.password-toggle:hover{background:#f5effb}.password-toggle:focus-visible{outline:2px solid #8b55c5;outline-offset:2px}.password-toggle svg{width:20px;height:20px;display:block}button{width:100%;margin-top:22px;padding:13px;border:0;border-radius:10px;background:#7138b8;color:#fff;font:inherit;font-weight:750;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.message{display:none;margin-top:15px;padding:11px;border-radius:9px;background:#fff2f1;color:#a43e38;font-size:12px;line-height:1.5}.foot{text-align:center;color:#998ca6;font-size:11px;margin-top:22px}</style></head>
<body><main class="card"><div class="brand">EDWISE<strong>YÖNETİM MERKEZİ</strong></div><p class="sub">Devam etmek için hesabınızla giriş yapın.</p><form id="loginForm"><label for="username">Kullanıcı adı</label><input id="username" name="username" autocomplete="username" required maxlength="50"><label for="password">Şifre</label><div class="password-wrap"><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="128"><button class="password-toggle" id="togglePassword" type="button" aria-label="Şifreyi göster" aria-pressed="false" title="Şifreyi göster"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></button></div><label class="remember-option" style="display:flex;align-items:center;gap:9px;margin-top:15px;font-size:12px;font-weight:500;color:#6f5d82"><input id="rememberMe" name="rememberMe" type="checkbox" value="true" style="width:16px;height:16px;margin:0;accent-color:#7138b8"> Oturumum açık kalsın</label><button id="submit" type="submit">Giriş yap</button><div id="message" class="message" role="alert"></div></form><div class="foot">Güvenli yönetici erişimi · EDWISE</div></main>
<script>const form=document.getElementById("loginForm"),button=document.getElementById("submit"),message=document.getElementById("message"),passwordInput=document.getElementById("password"),togglePassword=document.getElementById("togglePassword");togglePassword.addEventListener("click",()=>{const show=passwordInput.type==="password";passwordInput.type=show?"text":"password";togglePassword.setAttribute("aria-label",show?"Şifreyi gizle":"Şifreyi göster");togglePassword.setAttribute("title",show?"Şifreyi gizle":"Şifreyi göster");togglePassword.setAttribute("aria-pressed",String(show));togglePassword.innerHTML=show?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18M10.6 10.6a2 2 0 002.8 2.8"/><path d="M9.9 5.2A10.8 10.8 0 0112 5c6.4 0 10 7 10 7a15.8 15.8 0 01-3.1 3.8M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7a10.7 10.7 0 004-.8"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>'});const params=new URLSearchParams(location.search);let next=params.get("next")||"/yonetim/";if(!next.startsWith("/")||next.startsWith("//"))next="/admin";(async()=>{try{const r=await fetch("/api/me",{credentials:"same-origin",cache:"no-store"});if(r.ok)location.replace(next)}catch{}})();form.addEventListener("submit",async e=>{e.preventDefault();button.disabled=true;button.textContent="Kontrol ediliyor…";message.style.display="none";try{const r=await fetch("/api/login",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify({username:form.username.value,password:form.password.value,rememberMe:document.getElementById("rememberMe").checked})});const d=await r.json();if(!r.ok||!d.success)throw new Error(d.message||"Giriş başarısız.");location.replace(next)}catch(err){message.textContent=err.message||"Giriş yapılamadı.";message.style.display="block"}finally{button.disabled=false;button.textContent="Giriş yap"}});</script></body></html>
