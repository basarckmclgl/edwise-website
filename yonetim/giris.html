<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>EDWISE | Yönetici Girişi</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#f7f1ff,#fff 65%);font:15px Inter,system-ui,Arial;color:#54218f}.card{width:min(100%,420px);padding:34px;background:#fff;border:1px solid #eee5f7;border-radius:20px;box-shadow:0 18px 55px #54218f12}.brand{text-align:center;font-size:12px;letter-spacing:2px;color:#8b55c5;font-weight:800}.brand strong{display:block;font-size:23px;letter-spacing:.5px;color:#54218f;margin:7px 0 4px}.sub{text-align:center;color:#827292;font-size:13px;margin:0 0 28px}label{display:block;font-size:12px;font-weight:700;margin:16px 0 7px}input{width:100%;padding:13px;border:1px solid #e5d9f0;border-radius:10px;font:inherit;color:#342344;outline:none}input:focus{border-color:#8b55c5;box-shadow:0 0 0 3px #8b55c51a}button{width:100%;margin-top:22px;padding:13px;border:0;border-radius:10px;background:#7138b8;color:#fff;font:inherit;font-weight:750;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.message{display:none;margin-top:15px;padding:11px;border-radius:9px;background:#fff2f1;color:#a43e38;font-size:12px;line-height:1.5}.foot{text-align:center;color:#998ca6;font-size:11px;margin-top:22px}</style></head>
<body><main class="card"><div class="brand">EDWISE<strong>YÖNETİM MERKEZİ</strong></div><p class="sub">Devam etmek için hesabınızla giriş yapın.</p><form id="loginForm"><label for="username">Kullanıcı adı</label><input id="username" name="username" autocomplete="username" required maxlength="50"><label for="password">Şifre</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="128"><label class="remember-option" style="display:flex;align-items:center;gap:9px;margin-top:15px;font-size:12px;font-weight:500;color:#6f5d82"><input id="rememberMe" name="rememberMe" type="checkbox" value="true" style="width:16px;height:16px;margin:0;accent-color:#7138b8"> Oturumum açık kalsın</label><button id="submit" type="submit">Giriş yap</button><div id="message" class="message" role="alert"></div></form><div class="foot">Güvenli yönetici erişimi · EDWISE</div></main>
<script>const form=document.getElementById("loginForm"),button=document.getElementById("submit"),message=document.getElementById("message");const params=new URLSearchParams(location.search);let next=params.get("next")||"/admin";if(!next.startsWith("/")||next.startsWith("//"))next="/admin";(async()=>{try{const r=await fetch("/api/me",{credentials:"same-origin",cache:"no-store"});if(r.ok)location.replace(next)}catch{}})();form.addEventListener("submit",async e=>{e.preventDefault();button.disabled=true;button.textContent="Kontrol ediliyor…";message.style.display="none";try{const r=await fetch("/api/login",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify({username:form.username.value,password:form.password.value,rememberMe:document.getElementById("rememberMe").checked})});const d=await r.json();if(!r.ok||!d.success)throw new Error(d.message||"Giriş başarısız.");location.replace(next)}catch(err){message.textContent=err.message||"Giriş yapılamadı.";message.style.display="block"}finally{button.disabled=false;button.textContent="Giriş yap"}});</script></body></html>
