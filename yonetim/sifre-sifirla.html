<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>EDWISE | Şifre Yenile</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#f7f1ff,#fff 65%);font:15px Inter,system-ui,Arial;color:#54218f}.card{width:min(100%,420px);padding:34px;background:#fff;border:1px solid #eee5f7;border-radius:20px;box-shadow:0 18px 55px #54218f12}.brand{text-align:center;font-size:12px;letter-spacing:2px;color:#8b55c5;font-weight:800}.brand strong{display:block;font-size:23px;letter-spacing:.5px;color:#54218f;margin:7px 0 4px}.sub{text-align:center;color:#827292;font-size:13px;margin:0 0 24px}label{display:block;font-size:12px;font-weight:700;margin:16px 0 7px}input{width:100%;padding:13px;border:1px solid #e5d9f0;border-radius:10px;font:inherit;color:#342344;outline:none}button{width:100%;margin-top:22px;padding:13px;border:0;border-radius:10px;background:#7138b8;color:#fff;font:inherit;font-weight:750;cursor:pointer}button:disabled{opacity:.6}.message{display:none;margin-top:15px;padding:11px;border-radius:9px;background:#f5effb;color:#65428a;font-size:12px;line-height:1.5}.foot{text-align:center;font-size:12px;margin-top:18px}.foot a{color:#7138b8}</style></head>
<body><main class="card"><div class="brand">EDWISE<strong>ŞİFRE YENİLEME</strong></div><p class="sub">Hesabınız için yeni bir şifre belirleyin.</p><form id="resetForm"><label for="password">Yeni şifre</label><input id="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required><label for="confirm">Yeni şifre (tekrar)</label><input id="confirm" type="password" autocomplete="new-password" minlength="8" maxlength="128" required><button id="submit" type="submit">Şifremi yenile</button><div id="message" class="message" role="status"></div></form><div class="foot"><a href="/yonetim/giris.html">Giriş ekranına dön</a></div></main>
<script>
const form=document.getElementById("resetForm"),button=document.getElementById("submit"),message=document.getElementById("message"),token=new URLSearchParams(location.search).get("token")||"";
if(!/^[a-f0-9]{64}$/i.test(token)){form.hidden=true;message.style.display="block";message.textContent="Şifre yenileme bağlantısı eksik veya geçersiz.";}
form.addEventListener("submit",async e=>{e.preventDefault();message.style.display="none";const password=document.getElementById("password").value,confirm=document.getElementById("confirm").value;if(password!==confirm){message.textContent="Girdiğiniz şifreler eşleşmiyor.";message.style.display="block";return;}button.disabled=true;button.textContent="Kaydediliyor…";try{const r=await fetch("/api/password-reset",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify({token,password})});const d=await r.json();message.textContent=d.message||"İşlem tamamlanamadı.";message.style.display="block";if(r.ok&&d.success){form.reset();button.textContent="Şifre yenilendi";setTimeout(()=>location.href="/yonetim/giris.html",1800);}else{button.disabled=false;button.textContent="Şifremi yenile";}}catch{message.textContent="Sunucuya ulaşılamadı. Tekrar deneyin.";message.style.display="block";button.disabled=false;button.textContent="Şifremi yenile";}});
</script></body></html>
