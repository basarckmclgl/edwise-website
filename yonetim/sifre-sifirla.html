<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>EDWISE | Şifre Yenileme</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:linear-gradient(135deg,#f7f1ff,#fff 65%);font:15px Inter,system-ui,Arial;color:#54218f}.card{width:min(100%,420px);padding:32px;background:#fff;border:1px solid #eee5f7;border-radius:20px;box-shadow:0 18px 55px #54218f12}.brand{text-align:center;font-size:12px;letter-spacing:2px;color:#8b55c5;font-weight:800}.brand strong{display:block;font-size:22px;letter-spacing:.5px;color:#54218f;margin:7px 0 4px}.sub{text-align:center;color:#827292;font-size:13px;line-height:1.55;margin:0 0 24px}label{display:block;font-size:12px;font-weight:700;margin:16px 0 7px}input{width:100%;padding:13px;border:1px solid #e5d9f0;border-radius:10px;font:inherit;color:#342344;outline:none}input:focus{border-color:#8b55c5;box-shadow:0 0 0 3px #8b55c51a}button{width:100%;margin-top:22px;padding:13px;border:0;border-radius:10px;background:#7138b8;color:#fff;font:inherit;font-weight:750;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.message{display:none;margin-top:15px;padding:12px;border-radius:9px;background:#f5effb;color:#65428a;font-size:12px;line-height:1.5}.message.error{background:#fff2f1;color:#a43e38}.back{display:block;text-align:center;margin-top:18px;color:#7138b8;font-size:12px;text-decoration:none}.foot{text-align:center;color:#998ca6;font-size:11px;margin-top:22px}
</style>
</head>
<body>
<main class="card">
<div class="brand">EDWISE<strong>ŞİFRE YENİLEME</strong></div>
<p class="sub">Hesabınız için yeni bir şifre belirleyin. Güvenliğiniz için en az 8 karakter kullanın.</p>
<form id="resetForm">
<label for="password">Yeni şifre</label>
<input id="password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
<label for="confirmPassword">Yeni şifre tekrar</label>
<input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
<button id="submit" type="submit">Şifremi yenile</button>
<div id="message" class="message" role="status"></div>
</form>
<a class="back" href="/yonetim/giris.html">Giriş ekranına dön</a>
<div class="foot">Güvenli yönetici erişimi · EDWISE</div>
</main>
<script>
const form=document.getElementById("resetForm");
const button=document.getElementById("submit");
const message=document.getElementById("message");
const token=new URLSearchParams(location.search).get("token")||"";
if(!/^[a-f0-9]{64}$/i.test(token)){
 message.textContent="Şifre yenileme bağlantısı eksik veya geçersiz. Yeni bir bağlantı talep edin.";
 message.classList.add("error");message.style.display="block";button.disabled=true;
}
form.addEventListener("submit",async event=>{
 event.preventDefault();
 const password=document.getElementById("password").value;
 const confirmation=document.getElementById("confirmPassword").value;
 if(password!==confirmation){message.textContent="Girdiğiniz şifreler eşleşmiyor.";message.className="message error";message.style.display="block";return;}
 if(password.length<8||password.length>128){message.textContent="Şifre 8–128 karakter arasında olmalıdır.";message.className="message error";message.style.display="block";return;}
 button.disabled=true;button.textContent="Şifre yenileniyor…";message.style.display="none";
 try{
  const response=await fetch("/api/password-reset",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify({token,password})});
  const data=await response.json();
  if(!response.ok||!data.success)throw new Error(data.message||"Şifre yenilenemedi.");
  message.textContent=data.message||"Şifreniz yenilendi. Yeni şifrenizle giriş yapabilirsiniz.";
  message.className="message";message.style.display="block";form.reset();button.style.display="none";
 }catch(error){message.textContent=error.message||"Şifre yenilenemedi.";message.className="message error";message.style.display="block";}
 finally{if(button.style.display!=="none"){button.disabled=false;button.textContent="Şifremi yenile";}}
});
</script>
</body>
</html>
